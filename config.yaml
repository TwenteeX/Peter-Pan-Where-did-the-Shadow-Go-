# Peter Pan — hardware-agnostic config (MVP / Phase 1–4)
# Override only what you need; defaults are in peter_pan.config.loader.

project:
  name: "Peter Pan, Where did the Shadow Go?"
  version: "0.1.0"

# Perception Hub: camera and VLM
perception:
  camera_index: 0
  image_width: 1280
  image_height: 720
  shadow:
    method: background_subtraction  # or sam
    threshold: 30
  vlm:
    provider: openai
    model: gpt-4o
    prompt: "Identify the object in this image and describe its key living attributes in one short phrase (e.g. a small white cat)."

# World Engine (for later 3D)
world_engine:
  use_depth: false
  voxel_size: 0.01

# Agent Brain
agent_brain:
  provider: openai
  model: gpt-4o

# Render Bridge: OSC for UE/Unity/TouchDesigner
render_bridge:
  transport: osc
  osc:
    host: "127.0.0.1"
    port: 7000
  websocket:
    url: "ws://127.0.0.1:8765"

# Sprint MVP — shadow contour (Goal A)
shadow_detector:
  # ROI in image pixels (adjust to your overhead camera crop)
  table_roi: [[0, 0], [1280, 0], [1280, 720], [0, 720]]
  table_boundary: [[0, 0], [640, 0], [640, 720], [0, 720]]
  color_space: lab
  darkness_threshold: 18
  min_area_px: 800
  max_regions: 3
  morph_open_kernel: 3
  morph_close_kernel: 7

# 2D world + agent start / goal (manual books until detection lands)
environment_builder:
  table_boundary: [[0, 0], [640, 0], [640, 720], [0, 720]]
  agent_start: [120, 640]
  goal_position: [580, 180]
  objects:
    - id: book_1
      type: book
      polygon: [[250, 410], [360, 410], [360, 470], [250, 470]]
      height_level: 1
      affordance: [obstacle, standable, climbable]
  # Narrative + Claude: who the shadow “is”, how to role-play, relations to props
  identity:
    source_object_label: "a small white porcelain cat figurine"
    role_instruction: "You are the cat’s shadow given agency; curious, soft-footed, wary of bright open table center, comforted by shade."
    persona_traits: [curious, cautious_near_edges, seeks_cool_shadow]
  scene_relationships:
    relations:
      - from: shadow_agent
        to: book_1
        relation: potential_stairs
        note: "Books are climbable but unfamiliar; approach with care."
      - from: shadow_agent
        to: shadow_regions
        relation: prefers
        note: "Shadow pools feel safe when glare is harsh elsewhere."

reasoning_agent:
  # rules = fast local geometry only | claude = Anthropic API + role prompt (needs ANTHROPIC_API_KEY)
  backend: claude
  fallback_to_rules: true
  edge_margin: 36
  grid_step: 16
  shadow_bias_weight: 12
  climbable_margin: 22
  log_dir: outputs/reasoning_logs
  claude:
    model: claude-sonnet-4-20250514
    max_tokens: 2048
    api_key_env: ANTHROPIC_API_KEY
    role_prompt_file: config/role_prompt_shadow.txt
    # role_prompt: |   # optional inline override of role_prompt_file
    #   Your inline role text...
